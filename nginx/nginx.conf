# ── Tienda pública: puerto 80 ──────────────────────────────────────────────────
server {
    listen 80;
    root /usr/share/nginx/client;
    index index.html;
    charset utf-8;

    # Tamaño máximo de uploads (CSV de productos, etc.)
    client_max_body_size 100m;

    # Proxy al API backend
    location /api {
        proxy_pass         http://api:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # SPA fallback: todas las rutas apuntan a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Panel admin: puerto 8080 ───────────────────────────────────────────────────
server {
    listen 8080;
    root /usr/share/nginx/admin;
    index index.html;
    charset utf-8;

    client_max_body_size 100m;

    location /api {
        proxy_pass         http://api:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
