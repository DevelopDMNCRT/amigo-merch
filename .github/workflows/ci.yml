name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build & Verify Modules (Server, Admin, Client)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            admin/package.json
            client/package.json

      - name: Verify Server
        run: |
          cd server
          npm install

      - name: Type-check & Build Admin
        run: |
          cd admin
          npm install
          npm run type-check
          npm run build

      - name: Build Client
        run: |
          cd client
          npm install
          npm run build
